name: quant-extension
on:
  push:
    branches: [agent/quant-risk-extension, agent/asof-calendar-repair, agent/quant-failure-mechanisms]
  pull_request:
    branches: [agent/empirical-production, agent/quant-risk-extension, agent/asof-calendar-repair]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.lock -r requirements-quant-extension.lock
      - run: python -m pip install -e . --no-deps --no-build-isolation
      - run: python -m pytest
      - run: python -m compileall src tests scripts
